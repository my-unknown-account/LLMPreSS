<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">LLMPreSS — semantic search for LLM pretraining corpora</title>
  <desc id="desc">Documents, a magnifying glass, a neural circuit and vector graph in teal, blue and violet above the LLMPreSS name.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#061e46"/><stop offset="1" stop-color="#0b3265"/></linearGradient>
    <linearGradient id="tealblue" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox"><stop stop-color="#08c8b5"/><stop offset=".52" stop-color="#048bd6"/><stop offset="1" stop-color="#1759e4"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox"><stop stop-color="#3f46ed"/><stop offset="1" stop-color="#7626e3"/></linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox"><stop stop-color="#15d6c0"/><stop offset=".48" stop-color="#139fda"/><stop offset="1" stop-color="#5f35ff"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#dfe9ff"/></linearGradient>
    <linearGradient id="backpaper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c2dfff"/><stop offset="1" stop-color="#7475ed"/></linearGradient>
    <linearGradient id="magnifier" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#005edc"/><stop offset=".56" stop-color="#174ce2"/><stop offset="1" stop-color="#6128e6"/></linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#e8f2ff"/></linearGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0c9ae9"/><stop offset=".55" stop-color="#2360e9"/><stop offset="1" stop-color="#7826e6"/></linearGradient>
    <linearGradient id="layer1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14d8ae"/><stop offset="1" stop-color="#10ade4"/></linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07c9d3"/><stop offset="1" stop-color="#1469ed"/></linearGradient>
    <linearGradient id="layer3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4d7bf6"/><stop offset="1" stop-color="#7837e8"/></linearGradient>
    <linearGradient id="glasshandle" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2350ec"/><stop offset="1" stop-color="#7524dd"/></linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12d6c2"/><stop offset=".55" stop-color="#1696de"/><stop offset="1" stop-color="#8230e9"/></linearGradient>
  </defs>

