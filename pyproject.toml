[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmpress"
version = "0.1.0"
description = "LLMPreSS (LLM Pretraining Semantic Search): search local indexes and retrieve passages."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/my-unknown-account/LLMPreSS"
Issues = "https://github.com/my-unknown-account/LLMPreSS/issues"

[project.scripts]
llmpress = "llmpress.semantic_search:main"

[tool.setuptools]
packages = ["llmpress"]
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
